[project]
name = "promises-yaml"
version = "0.1.1"
description = "Declare the cross-repo contracts your repos share, with a meaning and an invariant each, and lint them."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Will Pope" }]
keywords = ["contracts", "monorepo", "polyrepo", "agents", "claude-code", "firestore", "pubsub"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Documentation",
]
dependencies = ["pyyaml>=6", "jsonschema>=4"]

[project.urls]
Homepage = "https://github.com/Wpopeyer/promises"
Specification = "https://github.com/Wpopeyer/promises/blob/main/SPEC.md"

[project.scripts]
promises = "promises.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/promises"]

[dependency-groups]
dev = ["pytest>=8"]
